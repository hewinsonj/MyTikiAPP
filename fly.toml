# fly.toml file generated for mytikiapp on 2022-10-17T20:15:01-04:00

app = "mytikiapp"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# SECRET (session signing key) and MONGODB_URI are NOT set here — fly.toml is committed,
# so anything in [env] is public. Set them as secrets instead, which Fly injects at
# runtime and never writes to the repo:
#
#   fly secrets set SECRET="<random string>" -a mytikiapp
#   fly secrets set MONGODB_URI="mongodb+srv://<user>:<pw>@<host>/mytiki?retryWrites=true&w=majority"
#
# Note the database name in the path — without one, Mongo silently writes to "test".

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
